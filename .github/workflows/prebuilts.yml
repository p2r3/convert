name: Check prebuilt uploads

# catches prebuilts that got merged without being uploaded, or still staged on a fork
on:
  push:
    branches: ["master"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Install dependencies
        run: bun i --frozen-lockfile

      - name: Check prebuilts are uploaded and adopted
        run: bun run build:upload --check
        env:
          GH_TOKEN: ${{ github.token }}
