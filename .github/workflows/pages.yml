name: Publish to GitHub Pages

on:
  push:
    branches: ["master", "improvements"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - name: Install dependencies
        run: bun i --frozen-lockfile

      - name: Check linting
        run: bun run lint

      - name: Check formatting
        run: bun run fmt:check

      - name: Check prebuilts
        run: bun run build:check

      - name: Build
        run: |
          export VITE_COMMIT_SHA=${{ github.sha }}
          bun run build

      - name: Generate cache
        run: bun run cache:build

      - name: Test
        run: bun test ./test/

      # the same conversions on a cross-origin isolated page, which is how the site is served
      - name: Test with threads
        run: ISOLATED=1 bun test ./test/commonFormats.test.ts

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
